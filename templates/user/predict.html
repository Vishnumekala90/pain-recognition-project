{% extends "react_base.html" %} {% block content %}

<!-- Animated background -->
<div
  id="vanta-bg"
  data-type="birds"
  class="position-fixed w-100 h-100 top-0 start-0"
  style="z-index: -1"
></div>

<section
  class="min-vh-100 d-flex flex-column justify-content-start align-items-center pt-5"
>
  <!-- Navbar -->
  <div
    id="navbar-root"
    data-theme="light"
    data-logo="Pain Recognition"
    data-logo-position="left"
    data-nav-align="right"
    data-rounded="true"
    data-animate-type="animate__fadeInDown"
    data-nav-items='[
         {"name":"Dashboard","link":"/user/dashboard"},
         {"name":"Logout","link":"/"}
       ]'
  ></div>

  <!-- Upload Card -->
  <div class="container my-5">
    <div
      class="card shadow-lg border-0 glass-card mx-auto p-4"
      style="max-width: 500px"
    >
      <h3 class="text-center text-danger mb-3 fw-bold">
        <i class="fa-solid fa-file-csv"></i>Upload Test File
      </h3>
      <p class="text-black text-center mb-4">
        Upload your CSV or Excel test data to predict threats instantly
      </p>

      <form
        id="uploadForm"
        enctype="multipart/form-data"
        action="{{ url_for('user.PredictAction') }}"
        method="POST"
      >
        <input
          type="file"
          id="testFile"
          name="test_file"
          accept=".csv,.xlsx"
          class="form-control mb-3"
          required
        />
        <div class="text-center">
          <button type="submit" class="btn btn-gradient fw-bold px-4 py-2">
            Predict
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Prediction Results -->
  <div class="container mb-5" id="results-root"></div>
</section>

<!-- Custom Styles -->
<style>
  .glass-card {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border-radius: 20px;
  }

  .btn-gradient {
    background: linear-gradient(24deg, #09ff5bff, #2ff208cc);
    color: #060606ff;
    border: none;
    border-radius: 8px;
    transition: 0.3s;
  }

  .btn-gradient:hover {
    transform: translateY(-2px);
    box-shadow: 0px 4px 12px rgba(37, 117, 252, 0.4);
  }

  input[type="file"] {
    border-radius: 10px;
    padding: 10px;
  }
</style>

<!-- React Components -->
<script
  type="text/babel"
  src="{{ url_for('static', filename='react_components/VantaBackground.js') }}"
></script>
<script
  type="text/babel"
  src="{{ url_for('static', filename='react_components/Navbar.js') }}"
></script>
<script
  type="text/babel"
  src="{{ url_for('static', filename='react_components/ResultCard.js') }}"
></script>

{% endblock %}
